kind = "mobile"
previewPath = "/spendwise/"
title = "Spendwise"
description = "A mobile personal finance app for tracking expenses, reviewing spending breakdowns, and managing daily money activity."
version = "1.0.0"
id = "artifacts/spendwise"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/spendwise/" ]
localPort = 23167

[services.development]
run = "pnpm --filter @workspace/spendwise run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/spendwise", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/spendwise", "run", "serve" ]

[services.env]
PORT = "23167"
BASE_PATH = "/spendwise/"
